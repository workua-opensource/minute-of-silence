name: Track Traffic Stats

on:
  schedule:
      - cron: '0 0 * * 1'   # щопонеділка о 00:00 UTC
        workflow_dispatch:        # можливість запустити вручну

        permissions:
          contents: write

          jobs:
            track-traffic:
                runs-on: ubuntu-latest
                    steps:
                          - name: Checkout repository
                                  uses: actions/checkout@v4

                                        - name: Fetch traffic data
                                                env:
                                                          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                  run: |
                                                                            mkdir -p traffic-stats
                                                                                      DATE=$(date +'%Y-%m-%d')
                                                                                                curl -s -H "Authorization: Bearer $GH_TOKEN" \
                                                                                                               -H "Accept: application/vnd.github+json" \
                                                                                                                              "https://api.github.com/repos/${{ github.repository }}/traffic/clones" \
                                                                                                                                             > "traffic-stats/clones-$DATE.json"
                                                                                                                                                       curl -s -H "Authorization: Bearer $GH_TOKEN" \
                                                                                                                                                                      -H "Accept: application/vnd.github+json" \
                                                                                                                                                                                     "https://api.github.com/repos/${{ github.repository }}/traffic/views" \
                                                                                                                                                                                                    > "traffic-stats/views-$DATE.json"
                                                                                                                                                                                                    
                                                                                                                                                                                                          - name: Commit and push results
                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                            git config user.name "github-actions[bot]"
                                                                                                                                                                                                                                      git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                                                                git add traffic-stats/
                                                                                                                                                                                                                                                          git diff --cached --quiet || git commit -m "chore: update traffic stats $(date +'%Y-%m-%d')"
                                                                                                                                                                                                                                                                    git push
                                                                                                                                                                                                                                                                    
