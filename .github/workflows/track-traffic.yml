name: Track Traffic Stats

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge traffic data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p traffic-stats
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/traffic/clones" -o /tmp/clones-new.json
          curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/traffic/views" -o /tmp/views-new.json
          [ -f traffic-stats/clones-summary.json ] || echo '{"clones":[]}' > traffic-stats/clones-summary.json
          [ -f traffic-stats/views-summary.json ] || echo '{"views":[]}' > traffic-stats/views-summary.json
          jq -s '{clones: ((.[0].clones + .[1].clones) | group_by(.timestamp) | map(last) | sort_by(.timestamp))}' traffic-stats/clones-summary.json /tmp/clones-new.json | jq '.total_count = (.clones | map(.count) | add) | .total_uniques_sum = (.clones | map(.uniques) | add)' > /tmp/clones-merged.json
          mv /tmp/clones-merged.json traffic-stats/clones-summary.json
          jq -s '{views: ((.[0].views + .[1].views) | group_by(.timestamp) | map(last) | sort_by(.timestamp))}' traffic-stats/views-summary.json /tmp/views-new.json | jq '.total_count = (.views | map(.count) | add) | .total_uniques_sum = (.views | map(.uniques) | add)' > /tmp/views-merged.json
          mv /tmp/views-merged.json traffic-stats/views-summary.json

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic-stats/
          git diff --cached --quiet || git commit -m "chore: update traffic summary $(date +'%Y-%m-%d')"
          git push
